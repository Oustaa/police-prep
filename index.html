<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="بنك أسئلة وملخصات لتحضير مباريات الأمن الوطني بالمغرب — Préparation au concours de la Sûreté nationale : 432 questions vérifiées et 14 fiches, en arabe et en français.">
<meta name="color-scheme" content="light dark">
<meta name="google-adsense-account" content="ca-pub-9017597155293095">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9017597155293095" crossorigin="anonymous"></script>
<meta property="og:title" content="تحضير مباراة الأمن الوطني">
<meta property="og:description" content="432 questions vérifiées, simulation d'examen et 14 fiches — العربية / Français.">
<meta property="og:type" content="website">
<title>تحضير مباراة الأمن الوطني</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{color-scheme:light dark}
</style>
<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF0F4;
  --ink:#131820; --ink-2:#3D4753; --muted:#68727F;
  --line:#DBE0E7; --line-strong:#C3CBD5;
  --navy:#1C3F63; --navy-soft:#E7EEF6;
  --brass:#9A6D18; --brass-soft:#F6EEDC;
  --ok:#186D47; --ok-soft:#E2F1EA;
  --bad:#9E2029; --bad-soft:#FAE7E8;
  --shadow:0 1px 2px rgba(19,24,32,.06), 0 8px 24px -14px rgba(19,24,32,.28);
  --r:10px;
  --f-disp:"Noto Kufi Arabic", system-ui, sans-serif;
  --f-body:"IBM Plex Sans Arabic", system-ui, sans-serif;
}
html[lang="fr"]{
  --f-disp:"IBM Plex Sans Condensed","IBM Plex Sans", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0F131A; --surface:#161C25; --surface-2:#1E2631;
    --ink:#E7ECF3; --ink-2:#BAC4D0; --muted:#8B96A4;
    --line:#28313D; --line-strong:#3A4552;
    --navy:#77A8D8; --navy-soft:#1A2635;
    --brass:#D6A552; --brass-soft:#2A2317;
    --ok:#57C08D; --ok-soft:#13271F;
    --bad:#E8737D; --bad-soft:#2B1619;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --ground:#0F131A; --surface:#161C25; --surface-2:#1E2631;
  --ink:#E7ECF3; --ink-2:#BAC4D0; --muted:#8B96A4;
  --line:#28313D; --line-strong:#3A4552;
  --navy:#77A8D8; --navy-soft:#1A2635;
  --brass:#D6A552; --brass-soft:#2A2317;
  --ok:#57C08D; --ok-soft:#13271F;
  --bad:#E8737D; --bad-soft:#2B1619;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -16px rgba(0,0,0,.8);
}
html{direction:rtl}
html[dir="ltr"]{direction:ltr}
/* Arabic content shown inside a French shell keeps its own direction */
.rtl-content{direction:rtl; text-align:right}
html[lang="fr"] .qtext, html[lang="fr"] .opt > span:last-child, html[lang="fr"] .why{letter-spacing:0}
*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--f-body); font-size:16px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--f-disp); font-weight:700; line-height:1.35; text-wrap:balance; margin:0}
button{font-family:inherit; font-size:inherit; color:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.masthead{
  background:var(--surface); border-bottom:1px solid var(--line);
  position:sticky; top:0; z-index:20;
}
.masthead-in{
  max-width:1080px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.crest{
  width:36px; height:36px; flex:none; border-radius:8px;
  background:var(--navy-soft); border:1px solid var(--line);
  display:grid; place-items:center; color:var(--navy); font-size:18px;
}
.brand{display:flex; flex-direction:column; gap:1px; margin-inline-end:auto}
.brand b{font-family:var(--f-disp); font-size:16px; letter-spacing:-.01em}
.brand span{font-size:11.5px; color:var(--muted); letter-spacing:.02em}
.ghost{
  background:transparent; border:1px solid var(--line-strong); color:var(--ink-2);
  padding:6px 12px; border-radius:999px; font-size:13px; font-weight:500;
}
.ghost:hover{border-color:var(--navy); color:var(--navy)}

.tabs{
  max-width:1080px; margin:0 auto; padding:0 20px;
  display:flex; gap:2px; overflow-x:auto; scrollbar-width:thin;
}
.tab{
  background:none; border:0; padding:11px 15px 13px; font-size:14px; font-weight:600;
  color:var(--muted); border-bottom:2.5px solid transparent; white-space:nowrap;
}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--navy); border-bottom-color:var(--navy)}

main{max-width:1080px; margin:0 auto; padding:26px 20px 72px}
.panel[hidden]{display:none !important}

.eyebrow{
  font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--brass);
  text-transform:uppercase; margin:0 0 6px;
}
.lede{color:var(--ink-2); max-width:64ch; margin:6px 0 0}

/* ---------- dashboard ---------- */
.stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1px;
  background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin:22px 0}
.stat{background:var(--surface); padding:16px 18px}
.stat dt{font-size:12px; color:var(--muted); font-weight:500; margin:0 0 4px}
.stat dd{margin:0; font-family:var(--f-disp); font-size:26px; font-weight:700; line-height:1.1}
.stat dd small{font-size:13px; font-weight:500; color:var(--muted)}

.sec{margin-top:34px}
.sec > h2{font-size:18px; margin-bottom:4px}
.sec > p{margin:0 0 16px; color:var(--muted); font-size:14px}

.meter-list{display:flex; flex-direction:column; gap:0; border:1px solid var(--line);
  border-radius:var(--r); overflow:hidden; background:var(--surface)}
.meter{display:grid; grid-template-columns:1fr 92px 54px; align-items:center; gap:14px;
  padding:10px 16px; border-bottom:1px solid var(--line)}
.meter:last-child{border-bottom:0}
.meter-name{font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.track{height:6px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.fill{height:100%; border-radius:99px; background:var(--navy)}
.fill.lo{background:var(--bad)} .fill.mid{background:var(--brass)} .fill.hi{background:var(--ok)}
.meter-val{font-size:13px; color:var(--muted); text-align:end}

.launch{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px; margin-top:18px}
.card-btn{
  text-align:start; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); padding:16px 18px; display:flex; flex-direction:column; gap:5px;
  transition:border-color .15s, transform .15s;
}
.card-btn:hover{border-color:var(--navy); transform:translateY(-1px)}
.card-btn b{font-family:var(--f-disp); font-size:15px}
.card-btn span{font-size:13px; color:var(--muted); line-height:1.5}

/* ---------- quiz ---------- */
.quizbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  padding:12px 16px; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); margin-bottom:16px;
}
.quizbar .pos{font-family:var(--f-disp); font-weight:700; font-size:15px}
.quizbar .bar{flex:1; min-width:110px; height:5px; border-radius:99px; background:var(--surface-2); overflow:hidden}
.quizbar .bar i{display:block; height:100%; background:var(--navy); border-radius:99px; transition:width .3s}
.timer{font-family:var(--f-disp); font-weight:700; font-size:15px; color:var(--ink-2);
  padding:2px 10px; border-radius:6px; background:var(--surface-2)}
.timer.low{color:#fff; background:var(--bad)}
.score-live{font-size:13px; color:var(--muted)}

.qcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:22px 24px; box-shadow:var(--shadow)}
.qmeta{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
.chip{font-size:11px; font-weight:600; padding:2.5px 9px; border-radius:999px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
.chip.src{background:var(--navy-soft); color:var(--navy); border-color:transparent}
.chip.rep{background:var(--ok-soft); color:var(--ok); border-color:transparent}
.qtext{font-family:var(--f-disp); font-size:19px; font-weight:500; line-height:1.6; margin:0 0 18px}

.opts{display:flex; flex-direction:column; gap:8px; list-style:none; padding:0; margin:0}
.opt{
  width:100%; text-align:start; display:flex; gap:12px; align-items:flex-start;
  background:var(--surface); border:1px solid var(--line-strong); border-radius:8px;
  padding:12px 14px; font-size:15px; line-height:1.55; transition:border-color .12s, background .12s;
}
.opt:hover:not(:disabled){border-color:var(--navy); background:var(--navy-soft)}
.opt:disabled{cursor:default}
.opt .key{
  flex:none; width:24px; height:24px; border-radius:6px; display:grid; place-items:center;
  background:var(--surface-2); font-size:12.5px; font-weight:700; font-family:var(--f-disp);
  color:var(--ink-2); margin-top:1px;
}
.opt.sel{border-color:var(--navy); background:var(--navy-soft)}
.opt.sel .key{background:var(--navy); color:var(--surface)}
.opt.right{border-color:var(--ok); background:var(--ok-soft)}
.opt.right .key{background:var(--ok); color:#fff}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt.wrong .key{background:var(--bad); color:#fff}

.why{margin-top:16px; padding:14px 16px; border-radius:8px; background:var(--surface-2);
  border-inline-start:3px solid var(--brass); font-size:14.5px; line-height:1.7; color:var(--ink-2)}
.why b{color:var(--ink)}
.why .verdict{display:block; font-family:var(--f-disp); font-weight:700; margin-bottom:5px; font-size:14px}
.why.good .verdict{color:var(--ok)} .why.bad .verdict{color:var(--bad)}
.why.good{border-inline-start-color:var(--ok)} .why.bad{border-inline-start-color:var(--bad)}

.qfoot{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center}
.primary{
  background:var(--navy); color:var(--surface); border:1px solid var(--navy);
  padding:9px 20px; border-radius:8px; font-weight:600; font-size:14.5px;
}
.primary:hover{filter:brightness(1.1)}
.secondary{background:transparent; border:1px solid var(--line-strong); color:var(--ink-2);
  padding:9px 16px; border-radius:8px; font-weight:500; font-size:14px}
.secondary:hover{border-color:var(--navy); color:var(--navy)}
.hint{font-size:13px; color:var(--muted); margin-inline-start:auto}

/* ---------- setup / picker ---------- */
.picker{display:flex; flex-wrap:wrap; gap:7px; margin:14px 0 20px}
.pill{background:var(--surface); border:1px solid var(--line-strong); color:var(--ink-2);
  padding:6px 13px; border-radius:999px; font-size:13.5px; font-weight:500}
.pill:hover{border-color:var(--navy)}
.pill[aria-pressed="true"]{background:var(--navy); color:var(--surface); border-color:var(--navy)}
.pill .n{opacity:.65; font-size:12px; margin-inline-start:5px}

/* ---------- results ---------- */
.result{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:28px 26px; box-shadow:var(--shadow); text-align:center}
.big-score{font-family:var(--f-disp); font-size:56px; font-weight:700; line-height:1; margin:8px 0}
.big-score.pass{color:var(--ok)} .big-score.fail{color:var(--bad)}
.verdict-line{font-size:15px; color:var(--ink-2); margin:0 0 18px}
.breakdown{margin-top:24px; text-align:start}

/* ---------- sheets ---------- */
.sheet-wrap{display:grid; grid-template-columns:236px 1fr; gap:24px; align-items:start}
.sheet-nav{display:flex; flex-direction:column; gap:1px; background:var(--line);
  border:1px solid var(--line); border-radius:var(--r); overflow:hidden; position:sticky; top:112px}
.sheet-nav button{background:var(--surface); border:0; text-align:start; padding:9px 14px;
  font-size:13.5px; font-weight:500; color:var(--ink-2)}
.sheet-nav button:hover{background:var(--surface-2)}
.sheet-nav button[aria-current="true"]{background:var(--navy); color:var(--surface); font-weight:600}
.doc{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:30px 34px; min-width:0}
.doc h1{font-size:25px; margin:0 0 6px; padding-bottom:12px; border-bottom:2px solid var(--brass)}
.doc h2{font-size:19px; margin:32px 0 10px; color:var(--navy)}
.doc h3{font-size:16px; margin:24px 0 8px}
.doc p{margin:0 0 12px; color:var(--ink-2)}
.doc ul,.doc ol{margin:0 0 14px; padding-inline-start:22px; color:var(--ink-2)}
.doc li{margin-bottom:5px}
.doc strong{color:var(--ink); font-weight:700}
.doc code{background:var(--surface-2); padding:1px 5px; border-radius:4px; font-size:.9em}
.doc blockquote{margin:0 0 14px; padding:10px 16px; border-inline-start:3px solid var(--brass);
  background:var(--brass-soft); border-radius:0 6px 6px 0; color:var(--ink-2)}
.doc blockquote p:last-child{margin-bottom:0}
.doc hr{border:0; border-top:1px solid var(--line); margin:26px 0}
.tablebox{overflow-x:auto; margin:0 0 16px; border:1px solid var(--line); border-radius:8px}
.doc table{border-collapse:collapse; width:100%; font-size:14px}
.doc th,.doc td{padding:8px 12px; text-align:start; border-bottom:1px solid var(--line); vertical-align:top}
.doc th{background:var(--surface-2); font-weight:700; font-family:var(--f-disp); font-size:13px; white-space:nowrap}
.doc tr:last-child td{border-bottom:0}
.doc a{color:var(--navy)}

.langwrap{display:flex; gap:0; border:1px solid var(--line-strong); border-radius:999px; overflow:hidden}
.langwrap button{background:transparent; border:0; padding:6px 13px; font-size:12.5px;
  font-weight:600; color:var(--muted); font-family:var(--f-body)}
.langwrap button:hover{color:var(--ink)}
.langwrap button[aria-pressed="true"]{background:var(--navy); color:var(--surface)}

.scrim{position:fixed; inset:0; background:rgba(8,12,18,.62); z-index:60;
  display:grid; place-items:center; padding:20px}
.scrim[hidden]{display:none!important}
.dialog{background:var(--surface); border:1px solid var(--line-strong); border-radius:12px;
  max-width:430px; width:100%; padding:24px 26px; box-shadow:0 24px 60px -20px rgba(0,0,0,.55)}
.dialog h2{font-size:17px; margin:0 0 8px}
.dialog p{margin:0 0 6px; font-size:14.5px; color:var(--ink-2); line-height:1.6}
.dialog .warnline{color:var(--bad); font-weight:600; font-size:13.5px; margin-top:10px}
.dialog-foot{display:flex; gap:10px; justify-content:flex-end; margin-top:20px}
.danger{background:var(--bad); color:#fff; border:1px solid var(--bad);
  padding:9px 18px; border-radius:8px; font-weight:600; font-size:14.5px}
.danger:hover{filter:brightness(1.08)}

.note{font-size:13px; color:var(--muted); margin-top:20px; padding:12px 15px;
  background:var(--surface-2); border-radius:8px; border:1px solid var(--line)}

.adbox{display:block; margin-top:26px; padding:10px 12px 12px;
  border:1px dashed var(--line-strong); border-radius:8px; background:var(--surface)}
.adlabel{display:block; font-size:10.5px; font-weight:600; letter-spacing:.1em;
  color:var(--muted); text-transform:uppercase; margin-bottom:8px}
.adbox ins{min-height:90px}

/* ---------- tablet ---------- */
@media (max-width:780px){
  .sheet-wrap{grid-template-columns:1fr}
  .sheet-nav{position:static; flex-direction:row; flex-wrap:wrap; gap:6px; background:none; border:0; padding:0}
  .sheet-nav button{border:1px solid var(--line-strong); border-radius:999px; padding:9px 14px; font-size:13px}
  .doc{padding:24px 20px}
  .meter{grid-template-columns:1fr 60px 46px; gap:10px}
}

/* ---------- phone ---------- */
@media (max-width:560px){
  body{font-size:15.5px; -webkit-text-size-adjust:100%}

  /* The brand block scrolls away; only the tab strip stays pinned,
     so the header stops eating a third of the screen. */
  .masthead{position:static; border-bottom:0}
  .masthead-in{
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
    gap:10px 8px; row-gap:10px;
  }
  .crest{width:30px; height:30px; font-size:15px; border-radius:7px}
  .brand{flex:1 1 auto; min-width:0; margin-inline-end:0}
  .brand b{font-size:14.5px}
  .brand span{
    font-size:10.5px; line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .langwrap{order:3; flex:0 0 auto}
  .langwrap button{padding:9px 13px; font-size:12.5px; min-height:44px; white-space:nowrap}
  /* labels never wrap inside the pill; the row wraps instead */
  #themeBtn, #resetBtn{
    order:4; flex:0 1 auto; min-height:44px; padding:9px 13px;
    font-size:12.5px; white-space:nowrap;
  }

  .tabs{
    position:sticky; top:0; z-index:20;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:0 14px; gap:0;
    scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:13px 13px 12px; font-size:13.5px; min-height:46px; scroll-snap-align:start}

  main{padding:20px 14px 56px}
  .lede{font-size:14.5px}
  h1{font-size:22px!important}
  .sec > h2{font-size:16.5px}

  .stat-row{grid-template-columns:1fr 1fr; margin:18px 0}
  .stat{padding:13px 14px}
  .stat dd{font-size:22px}
  .stat dt{font-size:11.5px}

  .launch{grid-template-columns:1fr; gap:10px}
  .card-btn{padding:14px 16px; min-height:44px}

  .meter{grid-template-columns:1fr 54px 42px; gap:9px; padding:11px 13px}
  .meter-name{font-size:13px}
  .meter-val{font-size:12px}

  /* quiz */
  .quizbar{padding:10px 13px; gap:10px; position:sticky; top:46px; z-index:15}
  .quizbar .pos, .timer{font-size:14px}
  .score-live{font-size:12px; width:100%; order:3}
  .qcard{padding:17px 15px; border-radius:9px}
  .qtext{font-size:17px; margin-bottom:15px}
  .opt{padding:13px 12px; font-size:14.5px; gap:10px; min-height:48px; align-items:center}
  .opt .key{width:26px; height:26px; font-size:12px; margin-top:0}
  .why{padding:13px 14px; font-size:14px}
  .qmeta .chip{font-size:10.5px; padding:3px 8px}

  /* actions stack full width and stay thumb-sized */
  .qfoot{gap:9px}
  .qfoot .primary, .qfoot .secondary{flex:1 1 100%; min-height:48px; text-align:center}
  .hint{margin-inline-start:0; width:100%; font-size:12.5px}
  .picker{gap:6px}
  .pill{padding:9px 13px; font-size:13px; min-height:42px}

  /* results */
  .result{padding:22px 16px}
  .big-score{font-size:46px}
  .verdict-line{font-size:14px}
  .result .qfoot{justify-content:stretch}

  /* sheets */
  .doc{padding:18px 15px; border-radius:9px}
  .doc h1{font-size:21px}
  .doc h2{font-size:17px; margin-top:26px}
  .doc h3{font-size:15px}
  .doc table{font-size:13px}
  .doc th, .doc td{padding:7px 10px}
  .sheet-nav{gap:7px}
  .sheet-nav button{min-height:42px}

  /* dialog sits above the keyboard/notch and gets full-width buttons */
  .scrim{padding:14px; align-items:flex-end}
  .dialog{padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)); border-radius:14px}
  .dialog h2{font-size:16px}
  .dialog p{font-size:14px}
  .dialog-foot{flex-direction:column-reverse; gap:9px}
  .dialog-foot button{width:100%; min-height:48px}

  .adbox{margin-top:20px}
  .note{font-size:12.5px; padding:11px 13px}
}

@media (max-width:360px){
  .brand span{display:none}
  #themeBtn, #resetBtn{font-size:12px; padding:9px 6px}
  .tab{padding:13px 10px; font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>

<header class="masthead">

var ADS = {

var adsReady = false;
function initAds(){
  if(!ADS.client || adsReady) return;
  adsReady = true;
  /* The built page carries the loader in <head> so the AdSense reviewer sees
     it in the served HTML. Only inject when it is missing — i.e. when the
     unbuilt source file is opened directly. */
  if(document.querySelector('script[src*="adsbygoogle.js"]')) return;
  var s = document.createElement("script");
  s.async = true;
  s.crossOrigin = "anonymous";
  s.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + encodeURIComponent(ADS.client);
  document.head.appendChild(s);
}
function adUnit(slot){
  if(!ADS.client || !slot) return "";
  return '<aside class="adbox" aria-label="محتوى إعلاني">' +
         '<span class="adlabel">' + t("adLabel") + '</span>' +
         '<ins class="adsbygoogle" style="display:block" data-ad-client="' + ADS.client +
         '" data-ad-slot="' + slot + '" data-ad-format="auto" data-full-width-responsive="true"></ins></aside>';
}
function pushAds(el){
  if(!ADS.client) return;
  initAds();
  var units = el.querySelectorAll("ins.adsbygoogle");
  for(var i = 0; i < units.length; i++) pushOne(units[i]);
}
/* Pushing a unit whose container is still zero-width makes AdSense throw
   "No slot size for availableWidth=0", and that slot never recovers — it
   happens whenever the panel is hidden at push time. Wait for a real width. */
function pushOne(ins){
  if(ins.getAttribute("data-filled")) return;
  if(!ins.getBoundingClientRect().width){
    if(typeof ResizeObserver === "function"){
      var ro = new ResizeObserver(function(){
        if(ins.getBoundingClientRect().width){ ro.disconnect(); pushOne(ins); }
      });
      ro.observe(ins);
    }
    return;
  }
  ins.setAttribute("data-filled", "1");
  try{ (window.adsbygoogle = window.adsbygoogle || []).push({}); }catch(e){}
  watchFill(ins);
}
/* Google stamps data-ad-status only when an ad is actually served. While a site
   is pending review the slot is still processed (data-adsbygoogle-status becomes
   "done") and space is reserved, but no status is ever set and the frame stays
   empty — which is why testing for "unfilled" alone left a dead bordered box on
   the page. Anything not explicitly "filled" within 20s gets collapsed. */
function watchFill(ins){
  var box = ins.closest(".adbox");
  if(!box) return;
  var tries = 0;
  var iv = setInterval(function(){
    var st = ins.getAttribute("data-ad-status");
    if(st === "filled"){ box.hidden = false; clearInterval(iv); return; }
    if(st === "unfilled" || ++tries > 40){ box.hidden = true; clearInterval(iv); }
  }, 500);
}

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffle(a){ a = a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
/* The papers print the options in a fixed order, so a question answered twice
   is easy to pass by remembering "the third one" instead of the answer. Each
   session gets its own copy of the question with the options permuted and the
   answer index remapped; the bank object itself is never touched. */
var PINNED = /^\s*(?:جميع الأجوبة|كل الأجوبة|جميع الإجابات|جميع ما سبق|كل ما سبق|جميع ما ذكر|لا شيء مما سبق|toutes les réponses|aucune de ces|aucune des réponses)/i;
function shuffleOpts(q){
  var n = q.opts.length, idx = [], pin = [];
  for(var i=0;i<n;i++){ (PINNED.test(q.opts[i]) ? pin : idx).push(i); }
  var order = shuffle(idx).concat(pin);   /* "all/none of the above" stays last */
  var copy = {};
  for(var k in q){ if(Object.prototype.hasOwnProperty.call(q,k)) copy[k] = q[k]; }
  copy.opts = order.map(function(i){ return q.opts[i]; });
  copy.a = order.indexOf(q.a);
  return copy;
}
function cats(){
  var m = {};
  bank().forEach(function(q){ (m[q.cat] = m[q.cat] || []).push(q); });
  return m;
}
function mastery(list){
  var att=0, ok=0;
  list.forEach(function(q){ var r = store.seen[q.id]; if(r && r.n){ att++; ok += r.ok/r.n; } });
  return {att:att, pct: att ? Math.round(ok/att*100) : null};
}

});
function go(p){
  current = p;
  Array.prototype.forEach.call(document.querySelectorAll(".tab"), function(t){
    t.setAttribute("aria-selected", String(t.dataset.p === p)); });
  Object.keys(panels).forEach(function(k){ panels[k].hidden = (k !== p); });
  render();
  window.scrollTo({top:0, behavior:"instant"});
}

/* ---------- session ---------- */
var session = null, timerId = null;

function startSession(mode, queue, minutes){
  session = {mode:mode, queue:queue.map(shuffleOpts), i:0, picked:null, answered:false,
             correct:0, log:[], active:true, endsAt: minutes ? Date.now()+minutes*60000 : null};
  if(timerId){ clearInterval(timerId); timerId = null; }
  if(minutes){
    timerId = setInterval(function(){
      if(!session || !session.active){ clearInterval(timerId); timerId=null; return; }
      var el = document.getElementById("timer");
      var left = session.endsAt - Date.now();
      if(left <= 0){ endExam(false); return; }
      if(el){ el.textContent = fmt(left); el.classList.toggle("low", left < 5*60000); }
    }, 500);
  }
  render();
}
function fmt(ms){
  var s = Math.max(0, Math.round(ms/1000));
  var m = Math.floor(s/60); s = s%60;
  return (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
function answer(idx){
  if(!session || session.answered && session.mode !== "exam") return;
  var q = session.queue[session.i];
  session.picked = idx;
  if(session.mode === "exam"){ render(); return; }
  session.answered = true;
  var good = idx === q.a;
  if(good) session.correct++;
  var r = rec(q.id); r.n++; if(good){ r.ok++; r.box = Math.min(5, r.box+1); } else { r.box = 0; }
  session.log.push({id:q.id, ok:good});
  save(); render();
}
function next(){
  if(!session) return;
  var q = session.queue[session.i];
  if(session.mode === "exam"){
    var good = session.picked === q.a;
    if(session.picked !== null){
      if(good) session.correct++;
      var r = rec(q.id); r.n++; if(good){ r.ok++; r.box = Math.min(5, r.box+1); } else { r.box = 0; }
    }
    session.log.push({id:q.id, ok:good, skipped: session.picked === null});
    save();
  }
  session.i++; session.picked = null; session.answered = false;
  if(session.i >= session.queue.length){ session.active = false; if(timerId){clearInterval(timerId); timerId=null;} }
  render();
}
function endExam(silent){
  if(!session) return;
  if(timerId){ clearInterval(timerId); timerId = null; }
  session.active = false;
  if(!silent) render();
}

/* ---------- renderers ---------- */
function render(){
  if(current === "home") renderHome();
  else if(current === "sheets") renderSheets();
  else renderQuizPanel(current);
}

function renderHome(){
  var B = bank();
  var total = B.length;
  var attempted = 0, mastered = 0, weak = 0;
  B.forEach(function(q){
    var r = store.seen[q.id];
    if(r && r.n){ attempted++; if(r.box >= 3) mastered++; if(r.ok/r.n < 0.5) weak++; }
  });
  var m = mastery(B);
  var cm = cats();
  var rows = Object.keys(cm).map(function(c){
    var st = mastery(cm[c]);
    return {name:c, n:cm[c].length, att:st.att, pct:st.pct};
  }).sort(function(a,b){
    if(a.pct === null && b.pct === null) return b.n - a.n;
    if(a.pct === null) return 1; if(b.pct === null) return -1;
    return a.pct - b.pct;
  });
  var corrected = B.filter(function(q){ return q.fixed; }).length;

  var h = '';
  h += '<p class="eyebrow">'+t("eyebrowHome")+'</p>';
  h += '<h1 style="font-size:27px">'+t("homeTitle")+'</h1>';
  h += '<p class="lede">'+t("homeLede")+'</p>';

  h += '<dl class="stat-row">';
  h += '<div class="stat"><dt>'+t("stAttempted")+'</dt><dd class="num">'+attempted+' <small>/ '+total+'</small></dd></div>';
  h += '<div class="stat"><dt>'+t("stAccuracy")+'</dt><dd class="num">'+(m.pct===null?'—':m.pct+'%')+'</dd></div>';
  h += '<div class="stat"><dt>'+t("stMastered")+'</dt><dd class="num">'+mastered+'</dd></div>';
  h += '<div class="stat"><dt>'+t("stWeak")+'</dt><dd class="num">'+weak+'</dd></div>';
  h += '</dl>';

  h += '<div class="launch">';
  h += '<button class="card-btn" data-go="drill"><b>'+t("cDrillT")+'</b><span>'+t("cDrillD")+'</span></button>';
  h += '<button class="card-btn" data-go="exam"><b>'+t("cExamT")+'</b><span>'+t("cExamD")+'</span></button>';
  h += '<button class="card-btn" data-go="weak"><b>'+t("cWeakT")+'</b><span>'+(weak ? weak+t("cWeakDn") : t("cWeakD0"))+t("cWeakTail")+'</span></button>';
  h += '<button class="card-btn" data-go="sheets"><b>'+t("cSheetsT")+'</b><span>'+t("cSheetsD")+'</span></button>';
  h += '</div>';

  h += '<div class="sec"><h2>'+t("masteryH")+'</h2>';
  h += '<p>'+t("masteryP")+'</p>';
  h += '<div class="meter-list">';
  rows.forEach(function(r){
    var pct = r.pct === null ? 0 : r.pct;
    h += '<div class="meter">';
    h += '<span class="meter-name'+(isFr()?' rtl-content':'')+'" title="'+esc(r.name)+'">'+esc(r.name)+'</span>';
    h += '<span class="track"><i class="fill '+fillClass(r.pct)+'" style="width:'+pct+'%"></i></span>';
    h += '<span class="meter-val num">'+(r.pct===null ? r.n+t("qShort") : r.pct+'%')+'</span>';
    h += '</div>';
  });
  h += '</div></div>';

  h += '<p class="note">'+(t("noteA")+t("noteB")).replace("{nAr}", arCount())+'</p>';

  h += adUnit(ADS.slotDashboard);

  panels.home.innerHTML = h;
  Array.prototype.forEach.call(panels.home.querySelectorAll("[data-go]"), function(b){
    b.addEventListener("click", function(){ go(b.dataset.go); });
  });
  pushAds(panels.home);
}

/* ----- quiz panels ----- */
var drillSel = [];

function renderQuizPanel(mode){
  var el = panels[mode];
  if(session && session.mode === mode){
    el.innerHTML = session.active ? quizHTML() : resultHTML();
    wireQuiz(el);
    return;
  }
  el.innerHTML = setupHTML(mode);
  wireSetup(el, mode);
}

function setupHTML(mode){
  var h = '';
  if(mode === "drill"){
    var cm = cats();
    var names = Object.keys(cm).sort(function(a,b){ return cm[b].length - cm[a].length; });
    h += '<p class="eyebrow">'+t("drillEye")+'</p><h1 style="font-size:24px">'+t("drillTitle")+'</h1>';
    h += '<p class="lede">'+t("drillLede")+'</p>';
    h += '<div class="picker">';
    names.forEach(function(c){
      var on = drillSel.indexOf(c) > -1;
      h += '<button class="pill'+(isFr()?' rtl-content':'')+'" data-cat="'+esc(c)+'" aria-pressed="'+on+'">'+esc(c)+'<span class="n num">'+cm[c].length+'</span></button>';
    });
    h += '</div>';
    h += '<div class="qfoot"><button class="primary" data-start="drill">'+t("drillStart")+'</button>';
    h += '<button class="secondary" data-clear>'+t("drillClear")+'</button>';
    h += '<span class="hint" id="selCount"></span></div>';
  } else if(mode === "exam"){
    h += '<p class="eyebrow">'+t("examEye")+'</p><h1 style="font-size:24px">'+t("examTitle")+'</h1>';
    h += '<p class="lede">'+t("examLede")+'</p>';
    h += '<div class="qfoot" style="margin-top:22px"><button class="primary" data-start="exam">'+t("examStart")+'</button>';
    h += '<span class="hint">'+t("examHint")+'</span></div>';
    h += '<p class="note">'+t("examNote")+'</p>';
  } else {
    var pool = weakPool();
    h += '<p class="eyebrow">'+t("weakEye")+'</p><h1 style="font-size:24px">'+t("weakTitle")+'</h1>';
    if(!pool.length){
      h += '<p class="lede">'+t("weakEmpty")+'</p>';
      h += '<div class="qfoot" style="margin-top:22px"><button class="primary" data-goto="drill">'+t("weakGo")+'</button></div>';
    } else {
      h += '<p class="lede">'+pool.length+t("weakN1")+'</p>';
      h += '<div class="qfoot" style="margin-top:22px"><button class="primary" data-start="weak">'+t("weakStart")+'</button></div>';
    }
  }
  return h;
}

function weakPool(){
  return bank().filter(function(q){
    var r = store.seen[q.id];
    return r && r.n > 0 && r.box < 3;
  }).sort(function(a,b){
    var ra = store.seen[a.id], rb = store.seen[b.id];
    if(ra.box !== rb.box) return ra.box - rb.box;
    return (ra.ok/ra.n) - (rb.ok/rb.n);
  });
}

function wireSetup(el, mode){
  Array.prototype.forEach.call(el.querySelectorAll("[data-cat]"), function(b){
    b.addEventListener("click", function(){
      var c = b.dataset.cat, k = drillSel.indexOf(c);
      if(k > -1) drillSel.splice(k,1); else drillSel.push(c);
      b.setAttribute("aria-pressed", String(k === -1));
      updCount(el);
    });
  });
  updCount(el);
  var clr = el.querySelector("[data-clear]");
  if(clr) clr.addEventListener("click", function(){ drillSel = []; renderQuizPanel("drill"); });
  var goto = el.querySelector("[data-goto]");
  if(goto) goto.addEventListener("click", function(){ go(goto.dataset.goto); });
  var st = el.querySelector("[data-start]");
  if(st) st.addEventListener("click", function(){
    if(mode === "drill"){
      var pool = drillSel.length ? bank().filter(function(q){ return drillSel.indexOf(q.cat) > -1; }) : bank().slice();
      startSession("drill", shuffle(pool), null);
    } else if(mode === "exam"){
      var eb = bank();
      startSession("exam", shuffle(eb).slice(0, Math.min(50, eb.length)), 60);
    } else {
      startSession("weak", weakPool().slice(0, 30), null);
    }
  });
}
function updCount(el){
  var s = el.querySelector("#selCount"); if(!s) return;
  var n = drillSel.length ? bank().filter(function(q){ return drillSel.indexOf(q.cat) > -1; }).length : bank().length;
  s.textContent = n + t("drillCount");
}

function quizHTML(){
  var q = session.queue[session.i], n = session.queue.length;
  var pct = Math.round(session.i / n * 100);
  var h = '';
  h += '<div class="quizbar">';
  h += '<span class="pos num">'+(session.i+1)+' / '+n+'</span>';
  h += '<span class="bar"><i style="width:'+pct+'%"></i></span>';
  if(session.mode === "exam"){
    h += '<span class="timer num" id="timer">'+fmt(session.endsAt - Date.now())+'</span>';
  } else {
    var done = session.log.length;
    h += '<span class="score-live num">'+session.correct+t("correctOfA")+done+'</span>';
  }
  h += '</div>';

  h += '<article class="qcard'+(isFr()?' rtl-content':'')+'">';
  h += '<div class="qmeta"><span class="chip src">'+esc(q.src)+'</span><span class="chip">'+esc(q.cat)+'</span>';
  if(q.reps > 1) h += '<span class="chip rep" title="'+esc((q.srcs||[]).join(" · "))+'">'+t("repBadge").replace("{n}", q.reps)+'</span>';
  h += '</div>';
  h += '<h2 class="qtext">'+esc(q.q)+'</h2>';
  h += '<ul class="opts">';
  q.opts.forEach(function(o, i){
    var cls = "opt";
    if(session.mode === "exam"){ if(session.picked === i) cls += " sel"; }
    else if(session.answered){
      if(i === q.a) cls += " right";
      else if(i === session.picked) cls += " wrong";
    }
    h += '<li><button class="'+cls+'" data-i="'+i+'"'+((session.answered && session.mode!=="exam")?" disabled":"")+'>';
    h += '<span class="key">'+KEYS[i]+'</span><span>'+esc(o)+'</span></button></li>';
  });
  h += '</ul>';

  if(session.answered && session.mode !== "exam"){
    var good = session.picked === q.a;
    h += '<div class="why '+(good?"good":"bad")+'">';
    h += '<span class="verdict">'+(good ? t("vGood") : t("vBad")+KEYS[q.a]+" — "+esc(q.opts[q.a]))+'</span>';
    h += mdInline(q.why);
    h += '</div>';
  }

  h += '<div class="qfoot">';
  if(session.mode === "exam"){
    h += '<button class="primary" data-next>'+(session.i+1 >= n ? t("finish") : t("nextQ"))+'</button>';
    h += '<button class="secondary" data-next>'+t("skip")+'</button>';
    h += '<span class="hint">'+t("examNoFeedback")+'</span>';
  } else if(session.answered){
    h += '<button class="primary" data-next>'+(session.i+1 >= n ? t("finish") : t("next"))+'</button>';
  } else {
    h += '<span class="hint">'+t("chooseHint")+'</span>';
  }
  h += '</div></article>';
  return h;
}

function mdInline(s){
  return esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/\n/g, "<br>");
}

function resultHTML(){
  var n = session.log.length || session.queue.length;
  var pct = n ? Math.round(session.correct / n * 100) : 0;
  var pass = pct >= 50;
  var h = '';
  h += '<div class="result">';
  h += '<p class="eyebrow">'+(session.mode === "exam" ? t("resExam") : t("resRound"))+'</p>';
  h += '<div class="big-score num '+(pass?"pass":"fail")+'">'+pct+'%</div>';
  h += '<p class="verdict-line num">'+session.correct+t("resFrom")+n+'</p>';
  var msg;
  if(pct >= 85) msg = t("m85");
  else if(pct >= 70) msg = t("m70");
  else if(pct >= 50) msg = t("m50");
  else msg = t("mLow");
  h += '<p class="verdict-line">'+msg+'</p>';
  h += '<div class="qfoot" style="justify-content:center">';
  h += '<button class="primary" data-again>'+t("again")+'</button>';
  h += '<button class="secondary" data-goto="weak">'+t("goWeak")+'</button>';
  h += '<button class="secondary" data-goto="home">'+t("goHome")+'</button>';
  h += '</div>';

  var wrong = session.log.filter(function(x){ return !x.ok; });
  if(wrong.length){
    h += '<div class="breakdown"><h3 style="font-size:15px; margin-bottom:10px">'+t("wrongH")+' ('+wrong.length+')</h3>';
    h += '<div class="meter-list">';
    wrong.slice(0, 25).forEach(function(x){
      var q = BANK.filter(function(b){ return b.id === x.id; })[0];
      if(!q) return;
      h += '<div class="meter'+(isFr()?' rtl-content':'')+'" style="grid-template-columns:1fr auto">';
      h += '<span class="meter-name" style="white-space:normal" title="'+esc(q.q)+'">'+esc(q.q)+'</span>';
      h += '<span class="chip">'+esc(q.cat)+'</span></div>';
    });
    h += '</div></div>';
  }
  h += '</div>';
  h += adUnit(ADS.slotResult);
  return h;
}

function wireQuiz(el){
  pushAds(el);
  Array.prototype.forEach.call(el.querySelectorAll(".opt"), function(b){
    b.addEventListener("click", function(){ answer(parseInt(b.dataset.i,10)); });
  });
  Array.prototype.forEach.call(el.querySelectorAll("[data-next]"), function(b){
    b.addEventListener("click", next);
  });
  var ag = el.querySelector("[data-again]");
  if(ag) ag.addEventListener("click", function(){ var m = session.mode; session = null; renderQuizPanel(m); });
  Array.prototype.forEach.call(el.querySelectorAll("[data-goto]"), function(b){
    b.addEventListener("click", function(){ session = null; go(b.dataset.goto); });
  });
}

/* ----- sheets ----- */
var sheetIdx = 0;
function sheetList(){
  if(!isFr()) return SHEETS;
  // French first, then the Arabic-only legal sheets
  return SHEETS.slice().sort(function(a,b){
    return (b.md_fr ? 1 : 0) - (a.md_fr ? 1 : 0);
  });
}
function askLeaveExam(onOk){
  var d = I18N[lang];
  document.getElementById("dlgTitle").textContent = d.tabs[2];
  document.getElementById("dlgBody").textContent = d.examLeave;
  document.getElementById("dlgWarn").textContent = "";
  document.getElementById("dlgCancel").textContent = d.dlgCancel;
  document.getElementById("dlgOk").textContent = d.dlgOk;
  dlgOnOk = onOk;
  dlgLastFocus = document.activeElement;
  scrim.hidden = false;
  document.getElementById("dlgCancel").focus();
}
function renderSheets(){
  var list = sheetList();
  if(sheetIdx >= list.length) sheetIdx = 0;
  var h = '<div class="sheet-wrap"><nav class="sheet-nav" aria-label="'+t("sheetsNav")+'">';
  list.forEach(function(s, i){
    h += '<button data-s="'+i+'"'+(isFr() && !s.md_fr ? ' class="rtl-content"' : '')+' aria-current="'+(i===sheetIdx)+'">'+esc(isFr() ? (s.title_fr || s.title) : s.title)+'</button>';
  });
  h += '</nav><article class="doc" id="docBody"></article></div>';
  panels.sheets.innerHTML = h;
  Array.prototype.forEach.call(panels.sheets.querySelectorAll("[data-s]"), function(b){
    b.addEventListener("click", function(){ sheetIdx = parseInt(b.dataset.s,10); renderSheets(); });
  });
  var body = document.getElementById("docBody");
  var cur = list[sheetIdx] || {md:""};
  var useFr = isFr() && cur.md_fr;
  var md = useFr ? cur.md_fr : cur.md;
  var pre = "";
  if(isFr() && !cur.md_fr){
    body.className = "doc rtl-content";
    pre = '<p class="note" style="direction:ltr; text-align:left; margin:0 0 22px">'+t("arOnly")+'</p>';
  } else {
    body.className = "doc";
  }
  if(window.marked){
    marked.setOptions({gfm:true, breaks:false, headerIds:false, mangle:false});
    body.innerHTML = pre + marked.parse(md);
  } else {
    body.textContent = md;
  }
  Array.prototype.forEach.call(body.querySelectorAll("table"), function(t){
    var box = document.createElement("div"); box.className = "tablebox";
    t.parentNode.insertBefore(box, t); box.appendChild(t);
  });
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", function(e){
  if(!session || !session.active) return;
  if(e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  var k = e.key;
  if(k >= "1" && k <= "5"){
    var i = parseInt(k,10)-1;
    var b = document.querySelector('.opt[data-i="'+i+'"]');
    if(b && !b.disabled){ b.click(); e.preventDefault(); }
  } else if(k === "Enter" || k === " "){
    var nb = document.querySelector("[data-next]");
    if(nb){ nb.click(); e.preventDefault(); }
  }
});

applyLang();
render();
})();
</script>
